services:
  - type: web
    name: trading-signal-bot-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: cron
    name: trading-signal-bot-scanner
    env: python
    plan: free
    schedule: "0 */4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scanner.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

